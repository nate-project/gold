# 每小时自动抓取金价并保存的工作流
name: Daily Gold Price Fetch

on:
  schedule:
    # 定时触发：每小时 UTC 整点运行一次，实现金价 hourly 自动更新
    - cron: '0 * * * *'
  # 允许在 GitHub Actions 页面手动触发，便于随时补抓
  workflow_dispatch:

# 赋予工作流向仓库写入内容的权限（用于提交 data/ 下新数据）
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码，后续脚本才能写入 data/ 目录
      - name: Checkout
        uses: actions/checkout@v4

      # 执行抓取脚本：请求接口并将当天数据格式化保存到 data/YYYY-MM-DD.json
      - name: Fetch and save gold price
        run: bash scripts/fetch_gold_price.sh

      # 若数据有变化则提交并推送，否则跳过（避免空提交）
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore: update gold price data for $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
