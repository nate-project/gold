<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日金价</title>
  <link rel="stylesheet" href="./lib/element_plus.css" />
  <script src="./lib/vue.js"></script>
  <script src="./lib/element_plus.js"></script>
  <style>
    body {
      margin: 0;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
    }

    .meta {
      color: #888;
      font-size: 13px;
      margin: 4px 0 16px;
    }

    .meta b {
      color: #555;
    }

    .section-title {
      margin: 18px 0 10px;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>

<body>
  <div id="app">
    <el-card shadow="always">
      <template #header>
        <div class="header">
          <h1>每日金价</h1>
          <el-button type="warning" :loading="loading" @click="refresh">刷新数据</el-button>
        </div>
      </template>

      <div class="meta">
        日期：<b>{{ dateStr }}</b> ｜ 数据来源：<el-tag size="small">{{ source }}</el-tag>
        <span v-if="lastUpdated"> ｜ 数据时间：{{ lastUpdated }}</span>
      </div>

      <el-alert v-if="error" type="error" :title="error" show-icon :closable="false" style="margin-bottom:12px" />

      <div class="section-title">贵金属行情</div>
      <el-table :data="metals" border stripe style="width: 100%">
        <el-table-column prop="name" label="名称" min-width="140" />
        <el-table-column prop="sell_price" label="卖出价" align="right" />
        <el-table-column prop="today_price" label="今日价" align="right" />
        <el-table-column prop="high_price" label="最高" align="right" />
        <el-table-column prop="low_price" label="最低" align="right" />
        <el-table-column prop="unit" label="单位" align="center" />
        <el-table-column prop="updated" label="更新时间" min-width="160" />
      </el-table>

      <div class="section-title">门店 / 市场报价</div>
      <el-table :data="stores" border stripe style="width: 100%">
        <el-table-column prop="brand" label="品牌" min-width="180" />
        <el-table-column prop="product" label="产品" min-width="120" />
        <el-table-column prop="price" label="价格" align="right" />
        <el-table-column prop="unit" label="单位" align="center" />
        <el-table-column prop="updated" label="更新时间" min-width="120" />
      </el-table>
    </el-card>
  </div>

  <script>
    const { createApp, ref, onMounted, onUnmounted } = Vue;

    // 每小时自动刷新一次（与 GitHub Action 抓取频率一致，可按需调整）
    const POLL_INTERVAL = 60 * 60 * 1000;

    createApp({
      setup() {
        const dateStr = ref("-");
        const source = ref("加载中…");
        const lastUpdated = ref("");
        const metals = ref([]);
        const stores = ref([]);
        const loading = ref(false);
        const error = ref("");
        let timer = null;

        const todayStr = () => {
          const d = new Date();
          const p = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        };

        // 取数据自带的时间（优先 updated_at 毫秒，其次 updated 字符串，再回退 date）
        const dataTime = (data) => {
          const ref = (data.metals && data.metals[0]) || (data.stores && data.stores[0]);
          if (ref) {
            if (ref.updated_at) {
              const d = new Date(ref.updated_at);
              const p = (n) => String(n).padStart(2, "0");
              return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            if (ref.updated) return ref.updated;
          }
          return data.date || "";
        };

        // 拿到数据后立即渲染显示
        const render = (data, src) => {
          dateStr.value = data.date || "-";
          source.value = src;
          metals.value = data.metals || [];
          stores.value = data.stores || [];
          error.value = "";
          lastUpdated.value = dataTime(data);
        };

        // 仅从本地 data/当天.json 读取数据（数据由 GitHub Action / fetch_gold_price.sh 生成）
        const loadData = async () => {
          loading.value = true;
          error.value = "";
          try {
            const today = todayStr();

            const res = await fetch(`data/${today}.json`, { cache: "no-store" });
            if (!res.ok) throw new Error("not found");
            render(await res.json(), `本地存档 data/${today}.json`);
          } catch (_) {
            dateStr.value = todayStr();
            source.value = "-";
            metals.value = [];
            stores.value = [];
            error.value =
              "未找到今日数据（data/" + todayStr() + ".json）。请等待 GitHub Action 每小时自动抓取，或在本地运行 scripts/fetch_gold_price.sh 生成后重新刷新。";
          } finally {
            loading.value = false;
          }
        };

        onMounted(() => {
          // 打开页面即加载当天数据
          loadData();
          // 每小时自动刷新，保持与最新存档同步（页面隐藏时不请求）
          timer = setInterval(() => {
            if (!document.hidden) loadData();
          }, POLL_INTERVAL);
        });

        onUnmounted(() => {
          if (timer) clearInterval(timer);
        });

        return { dateStr, source, lastUpdated, metals, stores, loading, error, refresh: loadData };
      },
    })
      .use(ElementPlus)
      .mount("#app");
  </script>
</body>

</html>
